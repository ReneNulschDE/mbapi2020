name: Run tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

# The default for this repository is "write". These jobs check out the
# code and install packages from PyPI, so the token they are handed
# should not be able to push anything.
permissions:
  contents: read

jobs:
  test:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"

      - uses: "actions/setup-python@v5"
        with:
          # Home Assistant 2026.9.x requires >=3.14.2. On 3.13 pip
          # silently resolves an older release, so the tests would pass
          # against a stale Home Assistant.
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # The parsers import Client, which imports homeassistant. Nothing
          # else in the test tree needs a running instance.
          pip install homeassistant
          # Pinned to match .pre-commit-config.yaml, so the linter here and
          # the one on a commit hook report the same thing. Unpinned, a new
          # ruff release can add rules and turn the build red without any
          # change to the code.
          pip install ruff==0.14.5 pytest==9.1.1

      - name: Check that every module at least compiles
        run: python -m compileall -q custom_components/mbapi2020

      - name: Check the test tree lints clean
        # Scoped to tests/ on purpose. The component itself carries 43
        # pre-existing findings on master (14 BLE001, 9 D102, 4 I001, ...),
        # so gating the whole package would fail on the first run and block
        # every PR until they were cleared. A broader gate can follow once
        # that debt is paid down; new test code is held to full ruff now.
        if: ${{ hashFiles('tests/test_*.py') != '' }}
        run: ruff check tests

      - name: Run tests
        # Skipped when there is nothing to run. The suite is on master now,
        # but the guard keeps the job green if tests/ is ever removed again:
        # pytest exits 4 when the path is missing and 5 when it collects
        # nothing, and either would fail the build.
        if: ${{ hashFiles('tests/test_*.py') != '' }}
        run: pytest tests -q
